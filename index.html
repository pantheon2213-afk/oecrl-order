<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OECRL 물품 관리 통합 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #111418;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #1d4ed8;
    --accent2: #0f766e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 16px 32px;
  }
  .hero { text-align: center; margin-bottom: 40px; }
  .hero img { width: 300px; max-width: 75%; height: auto; display: block; margin: 0 auto 28px; }
  .hero h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
  .hero p { margin-top: 8px; color: var(--muted); font-size: 15px; }

  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .tile {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 26px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative;
    overflow: hidden;
  }
  .tile::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--tone);
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.08); border-color: var(--tone); }
  .tile .icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--tone) 12%, white);
    color: var(--tone);
    margin-bottom: 18px;
  }
  .tile h2 { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
  .tile p { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .tile .go { margin-top: 18px; font-size: 14px; font-weight: 700; color: var(--tone); }
  .t-order { --tone: var(--accent); }
  .t-gas { --tone: var(--accent2); }

  footer { text-align: center; padding: 24px 16px; font-size: 12px; color: var(--muted); }

  @media (max-width: 640px) {
    main { padding-top: 36px; }
    .menu { grid-template-columns: 1fr; }
    .hero h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<main>
  <section class="hero">
    <img src="logo.png" alt="OECRL 로고" />
    <h1>OECRL 물품 관리 통합 플랫폼</h1>
    <p>Optoelectronics &amp; Energy Conversion Research Lab</p>
  </section>

  <section class="menu">
    <a class="tile t-order" href="order.html">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </div>
      <h2>물품 신청</h2>
      <p>시약·소모품·장비 구매 신청과 견적서 업로드, 발주·청구 현황 관리</p>
      <div class="go">바로가기 →</div>
    </a>

    <a class="tile t-gas" href="gas.html">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6" width="10" height="16" rx="3"/><path d="M10 6V3h4v3"/><path d="M9 2h6"/></svg>
      </div>
      <h2>가스 납품 관리</h2>
      <p>질소·아르곤·혼합가스 납품 일자와 수량 기록, 월별·종류별 누적 현황 확인</p>
      <div class="go">바로가기 →</div>
    </a>
  </section>
</main>
<footer>© OECRL · Department of Energy Engineering, Gyeongsang National University</footer>
</body>
</html>
